name: Build, Push to ECR, and Deploy on EC2

on:
  push:
    branches:
      - QA

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify WSL runner
        run: |
          uname -a
          whoami
          pwd

      - name: Show repo structure
        run: ls -la

      - name: List ansible files
        run: |
          cd ansible
          ls -la

